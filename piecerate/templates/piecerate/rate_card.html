{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payday — {{ style.name }} Rate Card</title>
{% include "attendance/_bootstrap_head.html" %}
    <link rel="stylesheet" href="{% static 'attendance/app.css' %}">
    <script src="{% static 'attendance/html2canvas.min.js' %}"></script>
<style>
    .page { width: 100%; margin: 0; padding: 1.5rem 1rem 3rem; }
    .report-status { font-size: 0.8rem; color: var(--text-muted); }
    .report-status.error { color: #b3261e; }
    .report-status.success { color: #1e7e34; }
    /* Single yellow header bar — title, style switcher, bulk Order Qty
       form, and the Production link all in one line (same convention
       as Device Records' header). */
    .month-nav {
        display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 1.25rem;
        background: var(--yellow); border: 1px solid rgba(0,47,102,0.15); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 0.5rem 0.85rem;
    }
    .month-nav h1 { font-size: 0.92rem; margin: 0; }
    .save-btn, .delete-btn {
        border: none; background: none; padding: 0; cursor: pointer; font-family: inherit;
        font-size: 0.7rem; text-decoration: underline;
    }
    .save-btn { color: var(--navy); }
    .save-btn:hover { color: var(--navy-deep); }
    .delete-btn { color: #b3261e; }
    .delete-btn:hover { color: #7a1a15; }
    .delete-btn:disabled { color: var(--text-muted); cursor: not-allowed; text-decoration: none; }
    /* Enable/Disable switch — a real Bootstrap form-switch now (see the
       markup) instead of a text Disable/Enable button, which read as
       ambiguous (disable *what*, from what state?) compared to a
       standard on/off toggle. */
    .op-enable-toggle:checked { background-color: #1e7e34; border-color: #1e7e34; }
    /* Disabled — stays on the rate card (toggle it back on any time) but
       is excluded from the Production page entirely; dimmed here so it
       reads as "off" without needing a separate column. */
    tr.op-row-disabled td { background: #f5f5f5; color: var(--text-muted); }
    tr.op-row-disabled .col-name select, tr.op-row-disabled input { color: var(--text-muted); }
    /* Zero operators (Production data) — same pink-row + red-left-edge
       flag as Production's own tr.op-row.no-operators, so an operation
       nobody's actually working stands out here too. Doesn't apply to a
       disabled operation (see the template) — zero operators there is
       expected, not something needing attention. */
    tr.no-operators td { background: #fdecea; }
    tr.no-operators td.col-op-code { box-shadow: inset 3px 0 0 #b3261e; }
    table.simple td.col-operators { max-width: 220px; white-space: normal; font-size: 0.75rem; color: var(--text-muted); }
    .no-operators-label { color: #b3261e; font-weight: 600; }
    .disabled-badge {
        display: inline-block; font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.02em; color: var(--text-muted); background: #e9ecef;
        padding: 0.1rem 0.4rem; border-radius: 999px; margin-left: 0.4rem;
    }
    /* Pay Type not needed in the UI anymore, but every row still submits
       it (see .pay-type-hidden/fillFromMaster in the script below) so an
       unrelated edit (rate, order qty, ...) never silently resets an
       existing operation's pay_type back to the default — just hidden
       from view, not removed from the form. */
    table.simple .col-pay-type { display: none; }

    .table-wrap { overflow: visible; }
    table.simple { border-collapse: collapse; }
    table.simple th, table.simple td { border: 1px solid #b7bcc4; padding: 0.1rem 0.4rem; font-size: 0.78rem; }
    table.simple th, table.simple th.num { background: #fef9c3; position: sticky; z-index: 5; text-align: center; }

    table.simple input[type="text"], table.simple input[type="number"], table.simple select {
        border: 1px solid var(--border); border-radius: 4px; padding: 0.1rem 0.3rem;
        font-size: 0.78rem; font-family: inherit; box-sizing: border-box;
    }
    table.simple input:focus, table.simple select:focus { outline: none; border-color: var(--navy); }
    table.simple input[readonly] { background: #f1f3f5; color: var(--text-muted); }
    table.simple select:disabled { background: #f1f3f5; color: var(--text-muted); }
    .col-drag { width: 20px; text-align: center; cursor: grab; color: var(--text-muted); user-select: none; }
    .col-drag:active { cursor: grabbing; }
    .col-op-code { width: 35px; text-align: center; color: var(--text-muted); }
    .col-section input { width: 90px; }
    .col-name select { width: 100%; min-width: 240px; }
    .col-machine input { width: 70px; }
    .col-rate input { width: 60px; }
    .col-rate input.rate-higher { color: #1e7e34; font-weight: 700; }
    .col-rate input.rate-lower { color: #b3261e; font-weight: 700; }
    .col-pay-type select { width: 100px; }
    .col-template-rate { color: var(--text-muted); }
    .col-template-rate.rate-higher, .col-template-rate.rate-lower { font-weight: 700; }
    .col-template-rate.rate-higher { color: #1e7e34; }
    .col-template-rate.rate-lower { color: #b3261e; }
    .template-summary {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 0.5rem 0.85rem; margin: 0 0 0.75rem; font-size: 0.85rem;
    }
    .ts-higher { color: #1e7e34; font-weight: 700; }
    .ts-lower { color: #b3261e; font-weight: 700; }
    .col-order-qty input { width: 65px; }
    .new-row td { background: #f8fafc; }
    tbody tr.dragging { opacity: 0.4; }
    tbody tr.drag-over { box-shadow: inset 0 2px 0 var(--navy); }
</style>
</head>
<body>
    {% include "attendance/_topbar.html" with current="piece_rate_styles" page_title="Rate Card — "|add:style.name %}

    <div class="month-nav">
        {# page_title here is just "Rate Card" (not "Rate Card — <style>" like _topbar.html's own, above) — the style switcher dropdown right next to this pill already shows the style name, so the pill repeating it would be a duplicate. #}
        {% include "attendance/_header_pill.html" with current="piece_rate_styles" page_title="Rate Card" %}
            {% include "piecerate/_style_icon.html" with style=style %}
            <select id="styleSwitch" class="search-input" style="min-width:180px;">
                {% for s in all_styles %}
                <option value="{% url 'piece_rate_rate_card' s.id %}"{% if s.id == style.id %} selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>
            {% if can_edit_this_style %}
            <form method="post" style="display:flex; gap:0.5rem; align-items:center;" onsubmit="return confirm('Set Order Qty to the entered value on every operation of this rate card?');">
                {% csrf_token %}
                <input type="hidden" name="action" value="bulk_order_quantity">
                <input type="number" min="0" step="1" name="bulk_order_quantity" id="bulkOrderQuantity" class="search-input" style="min-width:180px;" placeholder="Set Order Qty on all operations" required>
                <button type="submit" class="post-btn">Apply to All</button>
            </form>
            {% endif %}
            {% if not style.is_template %}
            <a href="{% url 'piece_rate_production' style.id %}" class="tab-btn">Production</a>
            {% endif %}
            <a class="icon-btn" href="{% url 'piece_rate_rate_card_download' style.id %}" data-tooltip="Download Excel file" aria-label="Download Excel file">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
            </a>
            <button type="button" class="icon-btn" id="sendRateCardWhatsappBtn" data-tooltip="Send screenshot to WhatsApp" aria-label="Send screenshot to WhatsApp">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-4.95A8.5 8.5 0 1 1 8.55 19.35L3 21z"/><path d="M8.5 9.5c0 3.5 2.5 6 6 6"/></svg>
            </button>
            <span id="sendRateCardWhatsappStatus" class="report-status"></span>
            <span id="orderSavedNote" style="font-size:0.8rem; color:var(--text-muted); display:none; margin-left:auto;">Order saved</span>
        </div>

    <div class="page">
        {% for message in messages %}
            <div class="msg {{ message.tags }}">{{ message }}</div>
        {% endfor %}

        {% if template_summary %}
        <div class="template-summary" data-tooltip="Operations matched by name against '{{ template_summary.template.name }}' — anything only on one side isn't counted here">
            vs template <strong>{{ template_summary.template.name }}</strong>:
            <span class="ts-higher">{{ template_summary.higher }} higher</span>,
            <span class="ts-lower">{{ template_summary.lower }} lower</span>,
            <span class="ts-same">{{ template_summary.same }} same</span>
            ({{ template_summary.matched }} matched) —
            net
            <strong class="{% if template_summary.net_diff > 0 %}ts-higher{% elif template_summary.net_diff < 0 %}ts-lower{% endif %}">
                {% if template_summary.net_diff > 0 %}+{% endif %}₹{{ template_summary.net_diff }}
            </strong>
        </div>
        {% endif %}

        <form method="post" id="rateCardForm">
            {% csrf_token %}
            <div class="table-wrap fit-content">
                <table class="simple" id="rateCardGrid">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Op Code</th>
                            <th>Section</th>
                            <th>Operation</th>
                            <th>Machine</th>
                            <th class="num">Rate</th>
                            {% if source_template %}<th class="num" data-tooltip="This operation's rate on {{ source_template.name }}">Template Rate</th>{% endif %}
                            <th class="col-pay-type">Pay Type</th>
                            <th class="num">Order Qty</th>
                            <th>Operators</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if can_edit_this_style %}
                        <tr class="new-row">
                            <td></td>
                            <td class="col-op-code">—</td>
                            <td class="col-section"><input type="text" name="section" readonly></td>
                            <td class="col-name">
                                <select name="name" class="op-select">
                                    <option value="">— choose operation —</option>
                                    {% regroup master_operations by section as section_list %}
                                    {% for section in section_list %}
                                    <optgroup label="{{ section.grouper|default:"(no section)" }}">
                                        {% for mop in section.list %}
                                        <option value="{{ mop.name }}">{{ mop.name }}</option>
                                        {% endfor %}
                                    </optgroup>
                                    {% endfor %}
                                </select>
                            </td>
                            <td class="col-machine"><input type="text" name="machine" readonly></td>
                            <td class="col-rate"><input type="number" step="0.01" name="rate"></td>
                            {% if source_template %}<td class="num col-template-rate">—</td>{% endif %}
                            <td class="col-pay-type">
                                <select class="pay-type-select" disabled>
                                    {% for value, label in pay_type_choices %}
                                    <option value="{{ value }}">{{ label }}</option>
                                    {% endfor %}
                                </select>
                                <input type="hidden" name="pay_type" class="pay-type-hidden" value="operator">
                            </td>
                            <td class="col-order-qty"><input type="number" step="1" min="0" name="order_quantity"></td>
                            <td class="col-operators"></td>
                            <td><button type="submit" name="action" value="create" class="save-btn">+ Add</button></td>
                        </tr>
                        {% endif %}
                        {% for op in operations %}
                        {% if can_edit_this_style %}
                        <tr id="op-{{ op.id }}" data-op-id="{{ op.id }}" data-op-name="{{ op.name|escapejs }}"{% if not op.is_enabled or not op.operator_names %} class="{% if not op.is_enabled %}op-row-disabled {% elif not op.operator_names %}no-operators{% endif %}"{% endif %}>
                            <td class="col-drag" draggable="true" title="Drag to reorder">⠿</td>
                            <td class="col-op-code">{{ forloop.counter }}</td>
                            <td class="col-section"><input type="text" name="section_{{ op.id }}" value="{{ op.section }}" readonly></td>
                            <td class="col-name">
                                <select name="name_{{ op.id }}" class="op-select">
                                    <option value="">— choose operation —</option>
                                    {% regroup master_operations by section as section_list %}
                                    {% for section in section_list %}
                                    <optgroup label="{{ section.grouper|default:"(no section)" }}">
                                        {% for mop in section.list %}
                                        <option value="{{ mop.name }}"{% if mop.name == op.name %} selected{% endif %}>{{ mop.name }}</option>
                                        {% endfor %}
                                    </optgroup>
                                    {% endfor %}
                                </select>
                                {% if not op.is_enabled %}<span class="disabled-badge">Disabled</span>{% endif %}
                            </td>
                            <td class="col-machine"><input type="text" name="machine_{{ op.id }}" value="{{ op.machine }}" readonly></td>
                            <td class="col-rate"><input type="number" step="0.01" name="rate_{{ op.id }}" value="{{ op.rate }}"></td>
                            {% if source_template %}
                            <td class="num col-template-rate {{ op.vs_template_class }}">{% if op.template_rate is not None %}₹{{ op.template_rate }}{% else %}—{% endif %}</td>
                            {% endif %}
                            <td class="col-pay-type">
                                <select class="pay-type-select" disabled>
                                    {% for value, label in pay_type_choices %}
                                    <option value="{{ value }}"{% if value == op.pay_type %} selected{% endif %}>{{ label }}</option>
                                    {% endfor %}
                                </select>
                                <input type="hidden" name="pay_type_{{ op.id }}" class="pay-type-hidden" value="{{ op.pay_type }}">
                            </td>
                            <td class="col-order-qty"><input type="number" step="1" min="0" name="order_quantity_{{ op.id }}" value="{{ op.order_quantity }}"></td>
                            <td class="col-operators">{% if op.operator_names %}{{ op.operator_names|join:", " }}{% else %}<span class="no-operators-label">No operators</span>{% endif %}</td>
                            <td>
                                <button type="submit" name="action" value="edit_{{ op.id }}" class="save-btn">Save</button>
                                &nbsp;
                                <div class="form-check form-switch d-inline-block align-middle" title="{% if op.is_enabled %}Enabled — shows on the Production page{% else %}Disabled — hidden from the Production page{% endif %}">
                                    <input type="checkbox" class="form-check-input op-enable-toggle" role="switch" id="opEnable{{ op.id }}" data-op-id="{{ op.id }}" {% if op.is_enabled %}checked{% endif %}>
                                    <label class="form-check-label" for="opEnable{{ op.id }}">{% if op.is_enabled %}Enabled{% else %}Disabled{% endif %}</label>
                                </div>
                                &nbsp;
                                <button type="submit" name="action" value="delete_{{ op.id }}" class="delete-btn" data-confirm-name="{{ op.name|escapejs }}">Delete</button>
                            </td>
                        </tr>
                        {% else %}
                        <tr id="op-{{ op.id }}"{% if not op.is_enabled or not op.operator_names %} class="{% if not op.is_enabled %}op-row-disabled{% elif not op.operator_names %}no-operators{% endif %}"{% endif %}>
                            <td></td>
                            <td class="col-op-code">{{ forloop.counter }}</td>
                            <td>{{ op.section|default:"—" }}</td>
                            <td>{{ op.name }}{% if not op.is_enabled %}<span class="disabled-badge">Disabled</span>{% endif %}</td>
                            <td>{{ op.machine|default:"—" }}</td>
                            <td class="num">{{ op.rate }}</td>
                            {% if source_template %}
                            <td class="num col-template-rate {{ op.vs_template_class }}">{% if op.template_rate is not None %}₹{{ op.template_rate }}{% else %}—{% endif %}</td>
                            {% endif %}
                            <td class="col-pay-type">{{ op.get_pay_type_display }}</td>
                            <td class="num">{{ op.order_quantity }}</td>
                            <td class="col-operators">{% if op.operator_names %}{{ op.operator_names|join:", " }}{% else %}<span class="no-operators-label">No operators</span>{% endif %}</td>
                            <td>
                                {% if can_see_delete %}
                                <button type="button" class="delete-btn" disabled title="Verify with OTP to delete">Delete</button>
                                {% endif %}
                            </td>
                        </tr>
                        {% endif %}
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </form>
        {% if not operations %}
        <p class="empty-state">No operations yet — add one above to start this style's rate card.</p>
        {% endif %}
    </div>

    {{ master_map|json_script:"masterMap" }}
    <script>
        var masterMap = JSON.parse(document.getElementById('masterMap').textContent);

        function fillFromMaster(select) {
            var data = masterMap[select.value];
            var row = select.closest('tr');
            var sectionInput = row.querySelector('.col-section input');
            var machineInput = row.querySelector('.col-machine input');
            var rateInput = row.querySelector('.col-rate input');
            var payTypeSelect = row.querySelector('.pay-type-select');
            var payTypeHidden = row.querySelector('.pay-type-hidden');
            if (data) {
                sectionInput.value = data.section;
                machineInput.value = data.machine;
                rateInput.value = data.rate;
                payTypeSelect.value = data.pay_type;
                payTypeHidden.value = data.pay_type;
            } else {
                sectionInput.value = '';
                machineInput.value = '';
                rateInput.value = '';
                payTypeSelect.value = 'operator';
                payTypeHidden.value = 'operator';
            }
            updateRateColor(row);
        }

        function updateRateColor(row) {
            var select = row.querySelector('.op-select');
            var rateInput = row.querySelector('.col-rate input');
            var data = masterMap[select.value];
            rateInput.classList.remove('rate-higher', 'rate-lower');
            if (!data || rateInput.value === '') return;
            var current = parseFloat(rateInput.value);
            var masterRate = parseFloat(data.rate);
            if (isNaN(current) || isNaN(masterRate)) return;
            if (current > masterRate) rateInput.classList.add('rate-higher');
            else if (current < masterRate) rateInput.classList.add('rate-lower');
        }

        // An operation already used elsewhere on this rate card can't be
        // picked again — grey it out in every OTHER row's dropdown (a
        // row keeps its own current value selectable, so editing that
        // row without changing its operation still works).
        function refreshOptionAvailability() {
            var selects = document.querySelectorAll('.op-select');
            var usedElsewhere = {};
            selects.forEach(function (select) {
                if (select.value) usedElsewhere[select.value] = (usedElsewhere[select.value] || 0) + 1;
            });
            selects.forEach(function (select) {
                Array.from(select.options).forEach(function (option) {
                    if (!option.value) return;
                    var usedByAnother = option.value !== select.value && !!usedElsewhere[option.value];
                    option.disabled = usedByAnother;
                });
            });
        }

        document.querySelectorAll('.op-select').forEach(function (select) {
            select.addEventListener('change', function () {
                fillFromMaster(select);
                refreshOptionAvailability();
            });
            updateRateColor(select.closest('tr'));
        });
        refreshOptionAvailability();

        document.querySelectorAll('.col-rate input').forEach(function (input) {
            input.addEventListener('input', function () {
                updateRateColor(input.closest('tr'));
            });
        });

        document.getElementById('styleSwitch').addEventListener('change', function (e) {
            window.location.href = e.target.value;
        });
        document.getElementById('rateCardForm').addEventListener('submit', function (e) {
            var btn = e.submitter;
            if (btn && btn.classList.contains('delete-btn')) {
                if (!confirm('Delete operation ' + btn.dataset.confirmName + '?')) {
                    e.preventDefault();
                }
                return;
            }
            // Saving an existing row (never "+ Add", which has no
            // previous value to compare against) whose rate actually
            // changed from what it loaded with (input.defaultValue —
            // the original value="{{ op.rate }}") needs a confirm, same
            // as Delete already asks.
            if (btn && btn.name === 'action' && btn.value.indexOf('edit_') === 0) {
                var row = btn.closest('tr');
                var rateInput = row ? row.querySelector('.col-rate input') : null;
                if (rateInput && parseFloat(rateInput.value) !== parseFloat(rateInput.defaultValue)) {
                    var opName = row.dataset.opName || '';
                    if (!confirm('Change the rate for "' + opName + '" from ₹' + rateInput.defaultValue + ' to ₹' + rateInput.value + '?')) {
                        e.preventDefault();
                    }
                }
            }
        });

        // Enable/Disable switch — flipping it submits the whole form (same
        // round trip the Save/Delete buttons already do; the server's
        // toggle_enabled_ handler only ever touches this one row's
        // is_enabled regardless of what else is in the form) with a
        // dynamically-added action field, since a checkbox has no
        // name="action" value="..." of its own the way a submit button
        // does.
        document.querySelectorAll('.op-enable-toggle').forEach(function (toggle) {
            toggle.addEventListener('change', function () {
                var form = document.getElementById('rateCardForm');
                var action = document.createElement('input');
                action.type = 'hidden';
                action.name = 'action';
                action.value = 'toggle_enabled_' + toggle.dataset.opId;
                form.appendChild(action);
                form.submit();
            });
        });

        // Drag-and-drop reordering — the handle cell (⠿) is draggable;
        // dropping onto another row moves it ahead of/behind it, then
        // every row's Op Code display is renumbered by its new position
        // and the new order is saved to the server immediately in the
        // background (no separate save step).
        var tbody = document.querySelector('table.simple tbody');
        var draggedRow = null;
        var csrfToken = document.querySelector('#rateCardForm [name=csrfmiddlewaretoken]').value;

        function renumberRows() {
            var rows = tbody.querySelectorAll('tr[data-op-id]');
            rows.forEach(function (row, i) {
                row.querySelector('.col-op-code').textContent = i + 1;
            });
        }

        function saveOrder() {
            var ids = Array.from(tbody.querySelectorAll('tr[data-op-id]')).map(function (r) {
                return r.dataset.opId;
            });
            var formData = new FormData();
            formData.append('action', 'reorder');
            formData.append('order_csv', ids.join(','));
            formData.append('csrfmiddlewaretoken', csrfToken);
            fetch(window.location.href, { method: 'POST', body: formData })
                .then(function (resp) {
                    if (!resp.ok) throw new Error('save failed');
                    var note = document.getElementById('orderSavedNote');
                    note.style.display = '';
                    clearTimeout(note._hideTimer);
                    note._hideTimer = setTimeout(function () { note.style.display = 'none'; }, 1500);
                })
                .catch(function () {
                    alert('Could not save the new order — please try again.');
                });
        }

        tbody.querySelectorAll('.col-drag').forEach(function (handle) {
            handle.addEventListener('dragstart', function (e) {
                draggedRow = handle.closest('tr');
                draggedRow.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });
            handle.addEventListener('dragend', function () {
                if (draggedRow) draggedRow.classList.remove('dragging');
                draggedRow = null;
                tbody.querySelectorAll('.drag-over').forEach(function (r) { r.classList.remove('drag-over'); });
            });
        });

        tbody.querySelectorAll('tr[data-op-id]').forEach(function (row) {
            row.addEventListener('dragover', function (e) {
                e.preventDefault();
                if (!draggedRow || draggedRow === row) return;
                row.classList.add('drag-over');
            });
            row.addEventListener('dragleave', function () {
                row.classList.remove('drag-over');
            });
            row.addEventListener('drop', function (e) {
                e.preventDefault();
                row.classList.remove('drag-over');
                if (!draggedRow || draggedRow === row) return;
                var rect = row.getBoundingClientRect();
                var before = (e.clientY - rect.top) < rect.height / 2;
                row.parentNode.insertBefore(draggedRow, before ? row : row.nextSibling);
                renumberRows();
                saveOrder();
            });
        });

        // "Send to WhatsApp" — screenshots the rate card as currently on
        // screen, same single-table capture as Device Records' own
        // WhatsApp send.
        (function () {
            var btn = document.getElementById('sendRateCardWhatsappBtn');
            if (!btn) return;
            var statusEl = document.getElementById('sendRateCardWhatsappStatus');
            var table = document.getElementById('rateCardGrid');

            function getCookie(name) {
                var match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
                return match ? match.pop() : '';
            }

            btn.addEventListener('click', function () {
                btn.disabled = true;
                statusEl.className = 'report-status';
                statusEl.textContent = 'Capturing…';

                html2canvas(table, { backgroundColor: '#ffffff', scale: 1.5 })
                    .then(function (canvas) {
                        statusEl.textContent = 'Sending…';
                        canvas.toBlob(function (blob) {
                            var formData = new FormData();
                            formData.append('image', blob, 'rate-card.png');
                            formData.append('caption', 'Rate Card — {{ style.name|escapejs }}');
                            fetch('{% url "send_whatsapp_report" %}', {
                                method: 'POST',
                                headers: { 'X-CSRFToken': getCookie('csrftoken') },
                                body: formData,
                            })
                                .then(function (r) { return r.json(); })
                                .catch(function () {
                                    return { ok: false, error: 'Failed to reach the server.' };
                                })
                                .then(function (result) {
                                    btn.disabled = false;
                                    statusEl.textContent = result.ok ? 'Sent' : 'Failed (' + (result.error || 'error') + ')';
                                    statusEl.className = 'report-status ' + (result.ok ? 'success' : 'error');
                                });
                        }, 'image/png');
                    })
                    .catch(function (err) {
                        btn.disabled = false;
                        statusEl.textContent = 'Failed to capture the table: ' + ((err && err.message) || String(err));
                        statusEl.className = 'report-status error';
                    });
            });
        })();
    </script>
