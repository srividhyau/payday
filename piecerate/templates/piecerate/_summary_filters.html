<div class="operation-search">
    <input type="search" class="search-input" id="operationSearch" placeholder="Search operation" autocomplete="off" aria-label="Search operation">
    <div class="dropdown">
        <button type="button" class="btn btn-outline-primary btn-sm dropdown-toggle" id="styleFilterBtn" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">All styles</button>
        <div class="dropdown-menu style-filter-menu" aria-labelledby="styleFilterBtn">
            <button type="button" class="btn btn-link btn-sm" id="styleFilterClear">Clear selection</button>
            <div id="styleFilterList"></div>
        </div>
    </div>
    <span id="operationSearchCount" role="status"></span>
</div>
