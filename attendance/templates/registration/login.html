{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payday — Login</title>
    <link rel="stylesheet" href="{% static 'attendance/app.css' %}">
    <style>
        body {
            min-height: 100vh;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem 2rem 1.75rem;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--navy);
            margin-bottom: 1.5rem;
        }
        .brand .logo { width: 30px; height: 30px; flex: none; }
        h1 { font-size: 1.25rem; margin: 0 0 1.3rem; letter-spacing: -0.01em; color: var(--navy); }
        form p { margin: 0 0 1.2rem; }
        form label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; }
        form input {
            display: block; width: 100%; padding: 0.75rem 0.85rem; border: 1px solid #ccc;
            border-radius: 8px; font-size: 1.05rem; box-sizing: border-box;
        }
        button {
            width: 100%;
            background: var(--navy); color: var(--yellow); font-weight: 600; border: none;
            padding: 0.8rem 1.2rem; border-radius: 8px; cursor: pointer; font-size: 1.05rem;
            transition: background .15s ease;
        }
        button:hover { background: var(--navy-deep); }
        .msg { padding: 0.7rem 0.95rem; border-radius: 8px; margin-bottom: 1.1rem; font-size: 0.95rem; background: #fdecea; color: #b3261e; }
        .errorlist { list-style: none; margin: 0.3rem 0 0; padding: 0; color: #b3261e; font-size: 0.85rem; }

        /* Tablet and up — the phone-sized card (max-width: 400px) reads as
           lost/tiny in the middle of a much bigger, mostly-empty screen at
           these widths, so it scales up rather than staying pinned to the
           phone size. */
        @media (min-width: 600px) {
            .card { max-width: 460px; padding: 2.5rem 2.75rem 2.25rem; }
            .brand { font-size: 1.5rem; margin-bottom: 1.75rem; }
            .brand .logo { width: 36px; height: 36px; }
            h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
            form label { font-size: 0.95rem; }
            form input { padding: 0.85rem 1rem; font-size: 1.1rem; }
            button { padding: 0.9rem 1.2rem; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <img src="{% static 'attendance/mvic_logo.png' %}" alt="" class="logo">
            Payday
        </div>
        <h1>Sign in</h1>

        {% if form.non_field_errors %}
            <div class="msg">{{ form.non_field_errors.0 }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
