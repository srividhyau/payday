{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payday — Verify</title>
    <link rel="stylesheet" href="{% static 'attendance/app.css' %}">
    <style>
        body {
            min-height: 100vh;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem 2rem 1.75rem;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--navy);
            margin-bottom: 1.5rem;
        }
        .brand .logo { width: 30px; height: 30px; flex: none; }
        h1 { font-size: 1.25rem; margin: 0 0 0.5rem; letter-spacing: -0.01em; color: var(--navy); }
        .help-text { font-size: 0.9rem; color: var(--text-muted); margin: 0 0 1.3rem; }
        form p { margin: 0 0 1.2rem; }
        form label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; }
        form input {
            display: block; width: 100%; padding: 0.75rem 0.85rem; border: 1px solid #ccc;
            border-radius: 8px; font-size: 1.3rem; letter-spacing: 0.3em; text-align: center; box-sizing: border-box;
        }
        button {
            width: 100%;
            background: var(--navy); color: var(--yellow); font-weight: 600; border: none;
            padding: 0.8rem 1.2rem; border-radius: 8px; cursor: pointer; font-size: 1.05rem;
            transition: background .15s ease;
        }
        button:hover { background: var(--navy-deep); }
        .msg { padding: 0.7rem 0.95rem; border-radius: 8px; margin-bottom: 1.1rem; font-size: 0.95rem; background: #fdecea; color: #b3261e; }

        @media (min-width: 600px) {
            .card { max-width: 460px; padding: 2.5rem 2.75rem 2.25rem; }
            .brand { font-size: 1.5rem; margin-bottom: 1.75rem; }
            .brand .logo { width: 36px; height: 36px; }
            h1 { font-size: 1.4rem; }
            form label { font-size: 0.95rem; }
            form input { padding: 0.85rem 1rem; font-size: 1.4rem; }
            button { padding: 0.9rem 1.2rem; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <img src="{% static 'attendance/mvic_logo.png' %}" alt="" class="logo">
            Payday
        </div>
        <h1>Verify it's you</h1>
        <p class="help-text">This section needs the same verification as the admin console. Enter the 6-digit code from your authenticator app.</p>

        {% for message in messages %}
            <div class="msg">{{ message }}</div>
        {% endfor %}

        <form method="post">
            {% csrf_token %}
            <p>
                <label for="otpToken">Authenticator code</label>
                <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" name="token" id="otpToken" autofocus required>
            </p>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Verify</button>
        </form>
    </div>
</body>
</html>
