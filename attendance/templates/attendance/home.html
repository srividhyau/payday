{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Payday</title>
<link rel="stylesheet" href="{% static 'attendance/app.css' %}">
<style>
  :root {
    --muted: #64748b;
  }

  .landing {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
  }
  .landing .logo {
    width: clamp(120px, 30vw, 200px);
    height: clamp(120px, 30vw, 200px);
  }
  .landing h1 {
    margin: 0;
    font-size: clamp(1.8rem, 8vw, 3rem);
    letter-spacing: 0.02em;
    color: var(--navy);
  }
  .landing p {
    margin: 0;
    font-size: 1.1rem;
    color: var(--muted);
  }
  .landing .actions {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 0.5rem;
  }
  .landing .actions a {
    padding: 0.65rem 1.3rem;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    background: var(--navy);
    color: var(--yellow);
    transition: background .15s ease;
  }
  .landing .actions a:hover { background: var(--navy-deep); }
  .landing .actions a.secondary {
    background: transparent;
    color: var(--navy);
    border: 1px solid var(--navy);
  }
  .landing .actions a.secondary:hover { background: rgba(0,47,102,0.08); }
</style>
</head>
<body>
    {% include "attendance/_topbar.html" with current="home" %}
    <div class="landing">
        <img class="logo" src="{% static 'attendance/mvic_logo.png' %}" alt="Payday logo">
        <h1>Payday</h1>
        <p>Attendance, overtime, and the holiday calendar — in one place.</p>
        <div class="actions">
            <a href="{% url 'mark_attendance' %}">Mark Attendance</a>
            <a href="{% url 'dashboard' %}" class="secondary">Open Device Records</a>
            <a href="{% url 'upload' %}" class="secondary">Upload Device Records</a>
            <a href="{% url 'calendar' %}" class="secondary">Holiday Calendar</a>
        </div>
    </div>
</body>
</html>
