{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Payday</title>
{% include "attendance/_bootstrap_head.html" %}
<link rel="stylesheet" href="{% static 'attendance/app.css' %}">
<style>
  :root {
    --muted: #64748b;
  }

  .landing {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
  }
  .landing .logo {
    width: clamp(120px, 30vw, 200px);
    height: clamp(120px, 30vw, 200px);
  }
  .landing h1 {
    margin: 0;
    font-size: clamp(1.8rem, 8vw, 3rem);
    letter-spacing: 0.02em;
    color: var(--navy);
  }
  .landing p {
    margin: 0;
    font-size: 1.1rem;
    color: var(--muted);
  }
</style>
</head>
<body>
    {% include "attendance/_topbar.html" with current="home" page_title="Home" %}
    <div class="landing">
        <img class="logo" src="{% static 'attendance/mvic_logo.png' %}" alt="Payday logo">
        <h1>Payday</h1>
        <p>Attendance, overtime, and the holiday calendar — in one place.</p>
    </div>
{% include "attendance/_htmx_scripts.html" %}
</body>
</html>
